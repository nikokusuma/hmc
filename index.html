<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIM Les Mandarin</title>
<style>
:root{--r:#9b1c24;--bg:#f2f3f1;--c:#fff;--t:#1d2327;--m:#6b7378;--b:#dde0dc;--g:#2f6f5e}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--r);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b)}
nav a{padding:11px 15px;white-space:nowrap;cursor:pointer;color:var(--m)}nav a.on{color:var(--r);border-bottom:3px solid var(--r);font-weight:600}
main{padding:14px;max-width:1100px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}th{color:var(--m);font-weight:600;font-size:12px}
input,select,button{font:inherit;padding:7px 9px;border:1px solid var(--b);border-radius:6px;max-width:100%}
button{background:var(--r);color:#fff;border:0;cursor:pointer}button.g{background:#e8eae7;color:var(--t)}button.s{padding:3px 8px;font-size:12px}
:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:end}.f>*{flex:1 1 150px}.f label{font-size:12px;color:var(--m)}.f label input,.f label select{width:100%;color:var(--t)}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;background:#e8eae7}.red{background:#f6dcdd;color:var(--r)}.grn{background:#d9ece5;color:var(--g)}
.al{background:#f6dcdd;color:var(--r);padding:10px;border-radius:6px;margin-bottom:12px}
.big{font-size:20px;font-weight:700}.k{display:flex;gap:12px;flex-wrap:wrap}.k>div{flex:1 1 200px}
#lg{max-width:320px;margin:14vh auto}#lg input{width:100%;margin-bottom:8px}
summary{cursor:pointer}h3{margin:4px 0 10px}
</style></head><body><div id="app"></div><script>
const K='simles',$=s=>document.querySelector(s),BONUS_MIN=2,PASS_UNLOCK='hmc';
let db=JSON.parse(localStorage.getItem(K)||'null')||{users:[{u:'admin',p:'admin123'}],teachers:[],classes:[],students:[],ses:[],inv:[],sal:[],stock:[],inc:[],exp:[],closed:{},n:1};
const save=()=>localStorage.setItem(K,JSON.stringify(db)),id=()=>db.n++;
const pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ds(new Date()),ym=d=>d.slice(0,7);
const nextM=m=>{let[y,x]=m.split('-').map(Number);x++;if(x>12){x=1;y++}return y+'-'+pad(x)},prevM=m=>{let[y,x]=m.split('-').map(Number);x--;if(!x){x=12;y--}return y+'-'+pad(x)};
const by=(a,i)=>a.find(x=>x.id==i)||{},tm=t=>{const[a,b]=t.split(':');return a*60+ +b};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],TB={};
let pg='Kehadiran',ed=null,cd=today(),M=ym(today());
const lock=d=>db.closed[ym(d)]?(alert('Bulan '+ym(d)+' sudah ditutup. Buka dulu di menu Keuangan.'),1):0;
const od=i=>!i.paid&&today()>i.bm+'-10';

// ---- jadwal ----
function dayS(d){const dow=new Date(d+'T00:00').getDay(),r=[];
 db.classes.forEach(c=>{if(!(c.once?c.once==d:(c.days.includes(dow)&&d>=c.start)))return;
  const e=db.ses.find(s=>s.cid==c.id&&s.orig==d);
  if(!e)r.push({c,orig:d,date:d,time:c.time,room:c.room,att:[]});else if(e.date==d)r.push({...e,c})});
 db.ses.forEach(e=>{if(e.date==d&&e.orig!=d)r.push({...e,c:by(db.classes,e.cid)})});
 return r.sort((a,b)=>a.time.localeCompare(b.time))}
function ent(s){let e=db.ses.find(x=>x.cid==s.c.id&&x.orig==s.orig);if(!e){e={id:id(),cid:s.c.id,orig:s.orig,date:s.date,time:s.time,room:s.room,att:[]};db.ses.push(e)}return e}
function clash(c,d,t,room,orig){const a=tm(t),b=a+c.hours*60;
 return dayS(d).some(s=>!s.cancelled&&!(s.c.id==c.id&&s.orig==orig)&&(s.c.teacherId==c.teacherId||(room&&s.room==room))&&tm(s.time)<b&&a<tm(s.time)+s.c.hours*60)}
const find=(cid,o)=>dayS(cd).find(x=>x.c.id==cid&&x.orig==o);
function conf(el,cid,o,all){const s=find(cid,o);if(s.cancelled||lock(s.date))return;
 const ids=[...el.closest('details').querySelectorAll('.ck')].filter(x=>all||x.checked).map(x=>+x.value);
 const e=ent(s);e.done=1;e.att=ids;save();go()}
function mv(el,cid,o){const[d,t,r]=[...el.closest('details').querySelectorAll('.mv')].map(x=>x.value),s=find(cid,o);
 if(!d||!t)return alert('Isi tanggal dan jam pengganti');
 if(lock(d))return;
 if(clash(s.c,d,t,r,o))return alert('Bentrok dengan jadwal guru atau ruangan lain pada waktu itu');
 const e=ent(s);e.date=d;e.time=t;e.room=r;save();go()}
function cn(cid,o){const s=find(cid,o);if(new Date(s.date+'T'+s.time)<=new Date())return alert('Waktu kelas sudah terlewat, tidak bisa dibatalkan');
 if(confirm('Batalkan kelas ini?')){ent(s).cancelled=1;save();go()}}

// ---- tagihan ----
function ensureInv(){const m=ym(today()),pm=prevM(m);let ch=0;
 db.students.forEach(s=>{const c=by(db.classes,s.classId);
  if(s.status=='active'&&c.pay=='awal'&&!db.inv.some(i=>i.sid==s.id&&i.cid==c.id&&i.m==m&&i.t=='awal')){db.inv.push({id:id(),sid:s.id,cid:c.id,m,bm:m,t:'awal',amt:c.fee,paid:0});ch=1}
  if(!db.inv.some(i=>i.sid==s.id&&i.m==pm&&i.t=='akhir')){let a=0;
   db.ses.forEach(e=>{if(e.done&&ym(e.date)==pm&&e.att.includes(s.id)){const k=by(db.classes,e.cid);if(k.pay=='akhir')a+=k.fee*k.hours}});
   if(a){db.inv.push({id:id(),sid:s.id,m:pm,bm:m,t:'akhir',amt:a,paid:0});ch=1}}});
 if(ch)save()}
function pay(i){if(lock(today()))return;const x=by(db.inv,i);x.paid=1;x.pd=today();save();go()}
function unpay(i){const x=by(db.inv,i);if(prompt('Masukkan password khusus')!=PASS_UNLOCK)return alert('Password salah');if(lock(x.pd))return;x.paid=0;x.pd='';save();go()}
function cp(i){const x=by(db.inv,i),s=by(db.students,x.sid),t=`Halo, mengingatkan tagihan les Mandarin ${s.name} periode ${x.m} sebesar ${rp(x.amt)}. Mohon pembayaran paling lambat tanggal 10 ${x.bm}. Terima kasih.`;
 navigator.clipboard.writeText(t).then(()=>alert('Teks tersalin, tinggal tempel di WhatsApp'),()=>prompt('Salin teks ini',t))}
function gaji(t,m){let j=0,b=0,p=0;db.ses.forEach(e=>{if(e.done&&ym(e.date)==m){const c=by(db.classes,e.cid);if(c.teacherId==t.id){j+=c.hours;p+=c.hours*(c.tpay||0);if(e.att.length>=BONUS_MIN)b+=c.hours*c.bonus}}});
 const n=j?+t.ins||0:0;return{j,p,b,n,tot:p+b+n}}
function paySal(t){if(lock(today())||!confirm('Gaji yang sudah lunas tidak bisa dibatalkan. Lanjutkan?'))return;db.sal.push({id:id(),tid:t,m:M,amt:gaji(by(db.teachers,t),M).tot,pd:today()});save();go()}

// ---- umum ----
function table(n,h,rows,acts){TB[n]={h,rows};
 return `<div class=card><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}${acts?'<th></th>':''}</tr>${rows.map((r,i)=>`<tr>${r.map(x=>`<td>${typeof x=='number'?x.toLocaleString('id-ID'):esc(x)}</td>`).join('')}${acts?`<td>${acts(i)}</td>`:''}</tr>`).join('')||'<tr><td colspan=9>Belum ada data</td></tr>'}</table><button class="g s" onclick="xl('${n}')">Unduh Excel</button></div>`}
function xl(n){const t=TB[n],h='<meta charset=utf-8><table border=1><tr>'+t.h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>',a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([h],{type:'application/vnd.ms-excel'}));a.download=n+'.xls';a.click()}
const FORMS={
 teachers:[['name','Nama','text'],['ins','Insentif per bulan (Rp)','number']],
 classes:[['name','Nama kelas','text'],['type','Jenis','sel',()=>[['private','Private'],['grup','Grup']]],['teacherId','Guru','sel',()=>db.teachers.map(t=>[t.id,t.name])],['days','Hari (berulang)','days'],['once','Atau sekali datang (tanggal)','date'],['start','Mulai berulang','date'],['time','Jam mulai','time'],['hours','Durasi (jam)','number'],['room','Ruangan','text'],['fee','Tarif (bayar di awal: per bulan, di akhir: per jam)','number'],['tpay','Gaji guru per jam di kelas ini (Rp)','number'],['bonus','Bonus guru per jam','number'],['pay','Tempo pembayaran','sel',()=>[['awal','Di awal'],['akhir','Di akhir']]]],
 students:[['name','Nama','text'],['phone','No. WA','text'],['status','Status','sel',()=>[['active','Mendapat kelas'],['waiting','Waiting list']]],['classId','Kelas','sel',()=>db.classes.map(c=>[c.id,c.name])],['regFee','Biaya pendaftaran (waiting list)','number'],['note','Keterangan / rencana kelas','text']],
 stock:[['name','Nama barang','text'],['qty','Stok','number'],['min','Batas minimum','number'],['price','Harga jual (Rp)','number']]};
function form(c){const o=ed&&ed.c==c?by(db[c],ed.i):{};
 return `<div class=card><h3>${o.id?'Ubah data':'Tambah data'}</h3><div class=f>`+FORMS[c].map(([k,l,t,op])=>{const v=o[k]??'';
  return `<label>${l}`+(t=='sel'?`<select id=f_${k}><option value="">Pilih</option>${op().map(([a,b])=>`<option value="${a}" ${a==v?'selected':''}>${esc(b)}</option>`).join('')}</select>`
  :t=='days'?`<br><span id=f_${k}>${DAYS.map((x,i)=>`<label><input type=checkbox value=${i} ${(o[k]||[]).includes(i)?'checked':''} style=width:auto>${x}</label>`).join(' ')}</span>`
  :`<input id=f_${k} type=${t} ${t=='number'?'step=any':''} value="${esc(v)}">`)+'</label>'}).join('')+`</div><button onclick="sv('${c}')">Simpan</button> ${o.id?`<button class=g onclick="ed=null;go()">Batal</button>`:''}</div>`}
function sv(c){const o={};
 for(const[k,l,t]of FORMS[c]){const e=$('#f_'+k);o[k]=t=='days'?[...e.querySelectorAll(':checked')].map(x=>+x.value):t=='number'?+e.value:t=='sel'&&e.value!==''&&!isNaN(e.value)?+e.value:e.value}
 const old=ed&&ed.c==c?by(db[c],ed.i):{};if(!o.name)return alert('Nama wajib diisi');
 if(c=='classes'){if(!o.teacherId||!o.time||!o.hours||!o.type||!o.pay||!(o.days.length||o.once))return alert('Lengkapi jenis, guru, jam, durasi, tempo pembayaran, dan hari atau tanggal');if(o.once)o.days=[];o.start=o.start||today()}
 if(c=='students'){
  if(o.status=='waiting'){o.classId='';if(!o.note)return alert('Waiting list wajib mengisi rencana kelas di keterangan');if(!old.regDate)o.regDate=today()}
  else if(o.status=='active'&&!o.classId)return alert('Pilih kelas');else if(!o.status)return alert('Pilih status');
  if(old.id&&o.classId&&o.classId!=old.classId&&db.inv.some(i=>i.sid==old.id&&!i.paid))return alert('Kelas hanya bisa diubah jika semua tagihan siswa sudah lunas')}
 old.id?Object.assign(old,o):db[c].push({id:id(),...o});ed=null;save();go()}
const edit=(c,i)=>{ed={c,i};go()},del=(c,i)=>{if(confirm('Hapus data ini?')){db[c]=db[c].filter(x=>x.id!=i);save();go()}};
const crud=(c,h,row,extra)=>form(c)+table(c,h,db[c].map(row),i=>{const x=db[c][i];return `<button class="s g" onclick="edit('${c}',${x.id})">Ubah</button> <button class="s g" onclick="del('${c}',${x.id})">Hapus</button> ${extra?extra(x):''}`});
const mSel=()=>`<div class=card><label>Bulan <input type=month value=${M} onchange="M=this.value;go()"></label></div>`;

// ---- halaman ----
const P={
Kehadiran(){const L=dayS(cd);
 return `<div class=card><label>Tanggal <input type=date value=${cd} onchange="cd=this.value;go()"></label></div>`+(L.map(s=>{const c=s.c,st=db.students.filter(x=>x.status=='active'&&x.classId==c.id),a=`${c.id},'${s.orig}'`;
  return `<details class=card><summary><b>${s.time}</b> ${esc(c.name)} - ${esc(by(db.teachers,c.teacherId).name)}, ${esc(s.room||'tanpa ruangan')} ${s.cancelled?'<span class="tag red">Dibatalkan</span>':s.done?`<span class="tag grn">${s.att.length} hadir</span>`:''}${s.orig!=cd?' <span class=tag>Jadwal pengganti</span>':''}</summary><div style=margin-top:8px>`+(s.cancelled?'Kelas ini dibatalkan.':
  `${st.map(x=>`<label style=display:block><input type=checkbox class=ck value=${x.id} ${s.att.includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')||'Belum ada siswa di kelas ini.'}
  <div class=f><button onclick="conf(this,${a},1)">Hadir semua</button><button class=g onclick="conf(this,${a},0)">Konfirmasi yang dicentang</button></div>
  ${s.done?'':`<div class=f><label>Tanggal pengganti<input type=date class=mv value=${cd}></label><label>Jam<input type=time class=mv value=${s.time}></label><label>Ruangan<input class=mv value="${esc(s.room||'')}"></label><button class=g onclick="mv(this,${a})">Ganti jadwal (1 kali)</button></div>`}
  <button class="g s" onclick="cn(${a})">Batalkan kelas</button>`)+'</div></details>'}).join('')||'<div class=card>Tidak ada kelas pada tanggal ini.</div>')},
Siswa(){return crud('students',['Nama','No. WA','Status','Kelas','Biaya daftar (Rp)','Keterangan'],s=>[s.name,s.phone,s.status=='waiting'?'Waiting list':'Aktif',by(db.classes,s.classId).name||'-',s.regFee||0,s.note])},
Kelas(){return crud('classes',['Kelas','Jenis','Guru','Jadwal','Durasi (jam)','Tarif (Rp)','Gaji guru/jam (Rp)','Bonus/jam (Rp)','Bayar'],c=>[c.name,c.type,by(db.teachers,c.teacherId).name,(c.once||c.days.map(d=>DAYS[d]).join(','))+' '+c.time,c.hours,c.fee,c.tpay||0,c.bonus,c.pay])},
Guru(){return crud('teachers',['Nama','Insentif (Rp)'],t=>[t.name,t.ins])},
Tagihan(){const L=[...db.inv].sort((a,b)=>a.paid-b.paid||b.bm.localeCompare(a.bm));
 return table('tagihan',['Siswa','Periode','Keterangan','Jumlah (Rp)','Status'],L.map(i=>[by(db.students,i.sid).name,i.m,i.t=='awal'?by(db.classes,i.cid).name:'Pemakaian jam bulan lalu',i.amt,i.paid?'Lunas '+i.pd:od(i)?'BELUM BAYAR (lewat tanggal 10)':'Belum lunas']),
  i=>{const x=L[i];return x.paid?`<button class="s g" onclick="unpay(${x.id})">Buka kunci</button>`:`<button class=s onclick="pay(${x.id})">Lunas</button> <button class="s g" onclick="cp(${x.id})">Salin teks WA</button>`})},
Gaji(){const R=db.teachers.map(t=>({t,...gaji(t,M),r:db.sal.find(s=>s.tid==t.id&&s.m==M)}));
 return mSel()+table('gaji-'+M,['Guru','Jam mengajar','Gaji pokok (Rp)','Bonus (Rp)','Insentif (Rp)','Total (Rp)','Status'],R.map(x=>[x.t.name,x.j,x.p,x.b,x.n,x.r?x.r.amt:x.tot,x.r?'Lunas '+x.r.pd:'Belum lunas']),i=>R[i].r?'':`<button class=s onclick="paySal(${R[i].t.id})">Lunas</button>`)},
Rekap(){const S=db.ses.filter(e=>e.done&&ym(e.date)==M).sort((a,b)=>a.date.localeCompare(b.date));
 return mSel()+'<h3>Semua kelas yang sudah berjalan</h3>'+table('rekap-kelas-'+M,['Tanggal','Jam','Kelas','Guru','Jumlah hadir','Siswa hadir'],S.map(e=>{const c=by(db.classes,e.cid);return[e.date,e.time,c.name,by(db.teachers,c.teacherId).name,e.att.length,e.att.map(i=>by(db.students,i).name).join(', ')]}))
 +'<h3>Per siswa</h3>'+table('rekap-siswa-'+M,['Siswa','Kelas','Jumlah kali hadir'],db.students.map(s=>[s.name,by(db.classes,s.classId).name||'-',S.filter(e=>e.att.includes(s.id)).length]))},
Stok(){return crud('stock',['Barang','Stok','Minimum','Harga jual (Rp)','Status'],s=>[s.name,s.qty,s.min,s.price,s.qty<=s.min?'Stok menipis':'Aman'],s=>`<button class=s onclick="jual(${s.id})">Jual</button> <button class="s g" onclick="tambah(${s.id})">Tambah stok</button>`)},
Keuangan(){const L=[];
 db.inv.forEach(i=>{if(i.paid&&ym(i.pd)==M)L.push([i.pd,'Pemasukan','Les '+by(db.students,i.sid).name+' ('+i.m+')',i.amt])});
 db.students.forEach(s=>{if(s.regFee&&s.regDate&&ym(s.regDate)==M)L.push([s.regDate,'Pemasukan','Pendaftaran '+s.name,s.regFee])});
 db.inc.forEach(x=>{if(ym(x.date)==M)L.push([x.date,'Pemasukan',x.desc,x.amt])});
 db.sal.forEach(s=>{if(ym(s.pd)==M)L.push([s.pd,'Pengeluaran','Gaji '+by(db.teachers,s.tid).name+' ('+s.m+')',s.amt])});
 db.exp.forEach(x=>{if(ym(x.date)==M)L.push([x.date,'Pengeluaran',x.desc,x.amt])});
 L.sort((a,b)=>a[0].localeCompare(b[0]));const sum=t=>L.filter(x=>x[1]==t).reduce((a,x)=>a+x[3],0),pm=sum('Pemasukan'),pk=sum('Pengeluaran'),cl=db.closed[M];
 return mSel()+`<div class="card k"><div>Pendapatan total<div class=big>${rp(pm)}</div></div><div>Pengeluaran<div class=big>${rp(pk)}</div></div><div>Pendapatan bersih<div class=big>${rp(pm-pk)}</div></div></div>`
 +table('keuangan-'+M,['Tanggal','Jenis','Keterangan','Jumlah (Rp)'],L)
 +`<div class=card><h3>Tambah pengeluaran</h3><div class=f><input id=ed type=date value=${today()}><input id=edc placeholder=Keterangan><input id=ea type=number placeholder=Jumlah><button onclick="addExp()">Simpan</button></div></div>
 <div class=card>Bulan ${M}: <span class="tag ${cl?'red':'grn'}">${cl?'Ditutup':'Dibuka'}</span> <button class=g onclick="db.closed[M]=${cl?0:1};save();go()">${cl?'Buka bulan':'Tutup bulan'}</button></div>`},
Pengaturan(){return `<div class=card><h3>Backup data</h3><p>Data tersimpan di browser ini. Unduh backup secara berkala.</p><button onclick=bk()>Unduh backup</button> <input type=file accept=.json onchange=rs(this)></div>
 <div class=card><h3>Tambah atau ganti user</h3><div class=f><input id=nu placeholder=Username><input id=np type=password placeholder=Password><button onclick=au()>Simpan user</button></div></div>`}};
function addExp(){const d=$('#ed').value,t=$('#edc').value,a=+$('#ea').value;if(!d||!t||!a)return alert('Lengkapi tanggal, keterangan, jumlah');if(lock(d))return;db.exp.push({id:id(),date:d,desc:t,amt:a});save();go()}
function jual(i){const s=by(db.stock,i),q=+prompt('Jumlah terjual');if(!(q>0))return;if(q>s.qty)return alert('Stok tidak cukup');if(lock(today()))return;s.qty-=q;db.inc.push({id:id(),date:today(),desc:'Jual '+s.name+' x'+q,amt:q*s.price});save();go()}
function tambah(i){const q=+prompt('Jumlah stok masuk');if(q>0){by(db.stock,i).qty+=q;save();go()}}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)]));a.download='backup-les-'+today()+'.json';a.click()}
function rs(el){const r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);save();go()};r.readAsText(el.files[0])}
function au(){const u=$('#nu').value,p=$('#np').value;if(!u||!p)return;const x=db.users.find(y=>y.u==u);x?x.p=p:db.users.push({u,p});save();alert('User tersimpan')}
function login(){const u=db.users.find(x=>x.u==$('#u').value&&x.p==$('#p').value);if(u){sessionStorage.u=u.u;go()}else alert('Username atau password salah')}
function go(){const A=$('#app');
 if(!sessionStorage.u){A.innerHTML=`<div id=lg class=card><h3>SIM Les Mandarin</h3><input id=u placeholder=Username><input id=p type=password placeholder=Password onkeydown="event.key=='Enter'&&login()"><button onclick=login() style=width:100%>Masuk</button><p style="color:var(--m);font-size:12px">Login awal: admin / admin123. Ganti di menu Pengaturan.</p></div>`;return}
