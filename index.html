<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B8232D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jadwal Les</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
 --kertas:#F4F5F2;--putih:#fff;--tinta:#1F2528;--redup:#5F6A69;--garis:#DADFD9;--garis2:#EBEEE9;
 --seal:#B8232D;--seal-gelap:#8E1A22;--seal-muda:#F8E4E5;
 --giok:#2B6F5D;--giok-muda:#DCEEE7;--biru:#3F6489;--biru-muda:#E2EBF4;--amber:#8A5A0B;--amber-muda:#FAEFD7;
 --r:10px;--nav:64px
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--kertas);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;letter-spacing:-.01em;line-height:1.25}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--seal-gelap)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid #2B6F5D88;outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* kerangka */
#app{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main";padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
#top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--seal);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px 16px}
#top b{font-size:17px;letter-spacing:-.01em}
#top .ic{color:#fff}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);background:var(--putih);border-top:1px solid var(--garis);padding-bottom:env(safe-area-inset-bottom)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;min-height:var(--nav);border:0;background:none;color:var(--redup);font-size:11px;cursor:pointer}
#nav button svg{width:23px;height:23px}
#nav button[aria-current=page]{color:var(--seal);box-shadow:inset 0 3px 0 var(--seal);font-weight:700}
#main{grid-area:main;width:100%;max-width:900px;margin:0 auto;padding:16px 14px 32px;min-width:0}
@media(min-width:860px){
 #app{grid-template-columns:220px minmax(0,1fr);grid-template-areas:"top top" "nav main";padding-bottom:0}
 #nav{position:sticky;top:0;grid-area:nav;align-self:start;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--garis);min-height:calc(100dvh - 52px);padding:10px 8px;background:var(--putih)}
 #nav button{flex-direction:row;gap:12px;justify-content:flex-start;padding:11px 12px;min-height:0;font-size:15px;border-radius:8px}
 #nav button[aria-current=page]{box-shadow:none;background:var(--seal-muda)}
 #main{padding:24px 28px 48px}
}

/* judul halaman */
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;background:var(--seal);color:#fff;font-weight:600;padding:10px 16px;min-height:42px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--seal-gelap)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--putih);color:var(--tinta);border:1px solid var(--garis)}
.btn.ghost:hover{background:var(--garis2)}
.btn.teks{background:none;color:var(--seal-gelap);padding:8px 10px;min-height:38px}
.btn.teks:hover{background:var(--seal-muda)}
.btn.bahaya{color:var(--seal-gelap)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:14px;font-weight:600}
.btn.blok{width:100%}
.ic{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:0;background:none;border-radius:8px;cursor:pointer}
.ic:hover{background:#0001}

/* kartu dan daftar */
.card{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r);padding:14px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:var(--putih);border:1px solid var(--garis);border-radius:var(--r);padding:12px 14px}
.row.mati{opacity:.6}
.row .rm{min-width:0;flex:1}
.row .ra{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sub{color:var(--redup);font-size:14px;overflow-wrap:anywhere}
.nama{font-weight:700;overflow-wrap:anywhere}
.kosong{padding:28px 16px;text-align:center;color:var(--redup);background:var(--putih);border:1px dashed var(--garis);border-radius:var(--r)}
.chip{display:inline-block;font-size:12px;font-weight:600;line-height:1;padding:4px 8px;border-radius:99px;background:var(--garis2);color:var(--redup);vertical-align:middle}
.chip.m{background:var(--seal-muda);color:var(--seal-gelap)}
.chip.g{background:var(--giok-muda);color:var(--giok)}
.chip.b{background:var(--biru-muda);color:var(--biru)}
.chip.a{background:var(--amber-muda);color:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--garis);border-radius:8px;overflow:hidden;background:var(--putih)}
.seg button{border:0;background:none;padding:8px 14px;min-height:38px;cursor:pointer;color:var(--redup);font-weight:600}
.seg button[aria-pressed=true]{background:var(--seal);color:#fff}
.bagian{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bagian h2{font-size:16px}

/* form */
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:14px}
label.f>span.n{display:block;margin-bottom:4px}
label.f small{font-weight:400;color:var(--redup)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=month],input[type=password],input[type=search],select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid #B9C0BA;border-radius:8px;background:var(--putih);font-weight:400}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--giok)}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cek{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-weight:400}
.cek input{width:20px;height:20px;margin-top:2px;accent-color:var(--seal)}
.err{background:var(--seal-muda);color:var(--seal-gelap);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:14px;overflow-wrap:anywhere}
.info{background:var(--biru-muda);color:#27425f;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.ok{background:var(--giok-muda);color:#1d4e41;border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.warn{background:var(--amber-muda);color:var(--amber);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.hari{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.hari button{min-width:46px;min-height:42px;border:1px solid #B9C0BA;background:var(--putih);border-radius:8px;font-weight:600;cursor:pointer}
.hari button[aria-pressed=true]{background:var(--seal);border-color:var(--seal);color:#fff}
.jr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.jr b{width:72px;flex:none}
.jr input{max-width:140px}

/* panel (sheet) */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet .bd{position:absolute;inset:0;background:#10161888}
#sheet .pn{position:relative;width:100%;max-width:560px;max-height:92dvh;display:flex;flex-direction:column;background:var(--putih);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px #0003}
#sheet .pn-h{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 8px 18px;border-bottom:1px solid var(--garis2)}
#sheet .pn-b{overflow:auto;padding:16px 18px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media(min-width:600px){#sheet{align-items:center}#sheet .pn{border-radius:16px;max-height:88dvh}}
#toast{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 12px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
@media(min-width:860px){#toast{bottom:20px}}
.tos{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:520px;background:var(--tinta);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 6px 20px #0004;overflow-wrap:anywhere}
.tos.gagal{background:var(--seal-gelap)}
.tos button{border:0;background:none;color:#FFD9DB;font-weight:700;cursor:pointer;padding:4px 6px;white-space:nowrap}

/* tanggal dan minggu */
.tgl{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.tgl .jud{flex:1;text-align:center;font-weight:700;font-size:17px;line-height:1.2}
.tgl .jud small{display:block;font-weight:400;color:var(--redup);font-size:13px}
.minggu{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.minggu button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;min-height:56px;border:1px solid var(--garis);background:var(--putih);border-radius:10px;cursor:pointer;color:var(--redup);font-size:12px}
.minggu button b{font-size:16px;color:var(--tinta)}
.minggu button i{font-style:normal;font-size:11px;min-height:14px;color:var(--giok);font-weight:700}
.minggu button[aria-pressed=true]{background:var(--seal);border-color:var(--seal);color:#fff}
.minggu button[aria-pressed=true] b,.minggu button[aria-pressed=true] i{color:#fff}
.minggu button.hini:not([aria-pressed=true]){border-color:var(--seal);color:var(--seal-gelap)}
.tab{display:flex;gap:4px;overflow-x:auto;margin:0 -14px 14px;padding:0 14px;border-bottom:1px solid var(--garis);scrollbar-width:none}
.tab button{border:0;background:none;padding:10px 12px;min-height:44px;white-space:nowrap;color:var(--redup);font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
.tab button[aria-selected=true]{color:var(--seal);border-bottom-color:var(--seal)}

/* agenda: jam di kiri, kartu dengan garis status */
.agenda{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:start}
.slot .t{font-weight:700;font-size:18px;line-height:1.1;padding-top:12px;text-align:right}
.slot .t small{display:block;margin-top:3px;font-weight:400;font-size:12px;color:var(--redup)}
.kt{background:var(--putih);border:1px solid var(--garis);border-left:5px solid #AEB6B0;border-radius:var(--r);padding:11px 12px}
.kt.hadir{border-left-color:var(--giok)}.kt.izin,.kt.sakit{border-left-color:var(--biru)}.kt.alpa{border-left-color:var(--seal)}
.kt.diganti,.kt.batal{background:#F0F1EE;border-left-color:#C8CEC9}
.kt.diganti .nama,.kt.batal .nama{text-decoration:line-through;color:var(--redup)}
.kt .atas{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kt .aksi{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kt .cat{margin-top:6px;font-size:13px;color:var(--redup)}
.stamp{display:inline-block;flex:none;font-weight:800;font-size:12px;line-height:1;padding:4px 7px;border:2px solid currentColor;border-radius:5px;transform:rotate(-3deg);box-shadow:inset 0 0 0 1.5px var(--putih),inset 0 0 0 3px currentColor;background:var(--putih)}
.stamp.hadir{color:var(--giok)}.stamp.izin,.stamp.sakit{color:var(--biru)}.stamp.alpa{color:var(--seal)}
.stamp.diganti,.stamp.batal{color:#7B847F;box-shadow:none;border-style:dashed}
.stamp.terjadwal{color:#7B847F;border-width:1.5px;box-shadow:none;border-style:dashed;font-weight:600}
.stamp.baru{animation:cap .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cap{0%{transform:scale(1.7) rotate(-12deg);opacity:0}65%{transform:scale(.94) rotate(-3deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
.abs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.abs button{min-height:42px;border:1.5px solid var(--garis);background:var(--putih);border-radius:8px;font-weight:700;cursor:pointer;color:var(--redup)}
.abs button[aria-pressed=true]{color:#fff;border-color:transparent}
.abs button.s-hadir[aria-pressed=true]{background:var(--giok)}
.abs button.s-izin[aria-pressed=true],.abs button.s-sakit[aria-pressed=true]{background:var(--biru)}
.abs button.s-alpa[aria-pressed=true]{background:var(--seal)}

/* tabel laporan */
.tw{overflow-x:auto;border:1px solid var(--garis);border-radius:var(--r);background:var(--putih)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 10px;border-bottom:1px solid var(--garis2);text-align:left;vertical-align:top;font-size:14px}
th{background:#FAFBF9;font-weight:700;color:var(--redup);font-size:13px}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;background:#FAFBF9}
tr:last-child td{border-bottom:0}

/* daftar tanggal reminder */
.rem{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px 12px;align-items:start;background:var(--putih);border:1px solid var(--garis);border-radius:var(--r);padding:11px 12px}
.rem .dt{text-align:center;border-right:1px solid var(--garis2);padding-right:10px}
.rem .dt b{display:block;font-size:22px;line-height:1}
.rem .dt span{font-size:12px;color:var(--redup)}
.rem .ra{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.rem.lewat{opacity:.65}
.js2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--garis2)}
.js2:first-of-type{border-top:0}
.js2 .ra{display:flex;gap:4px}
.login{max-width:360px;margin:12dvh auto 0;padding:0 18px}
.login h1{font-size:26px;margin-bottom:4px}
.muat{padding:40px 0;text-align:center;color:var(--redup)}
details.lipat summary{cursor:pointer;font-weight:700;padding:10px 2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--biru,#3F6489);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
</style>
</head>

<script>
'use strict';

const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZib3V3a2hkYWVjYWxieXh2aXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMTgxMzQsImV4cCI6MjExMDc5NDEzNH0.aggwVDTYpbCMAZL_5g6w-urC2OmkdsoFO0O36UYzJU8';

// <logic>
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const isoDow=s=>{const g=parseD(s).getDay();return g===0?7:g};
const mondayOf=s=>addDays(s,1-isoDow(s));
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI_ISO=['','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtTgl=s=>{const d=parseD(s);return HARI[d.getDay()]+', '+d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()};
const fmtTgl3=s=>{const d=parseD(s);return HARI[d.getDay()].slice(0,3)+' '+d.getDate()+' '+BLN3[d.getMonth()]};
const fmtBulan=m=>{const[y,x]=m.split('-').map(Number);return BLN[x-1]+' '+y};
const hm=t=>String(t).slice(0,5);
const toMnt=t=>{const[a,b]=String(t).split(':');return +a*60+ +b};
const fromMnt=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const endT=(jam,dur)=>fromMnt(toMnt(jam)+dur);
const fmtDur=m=>m<60?m+' menit':(m%60?Math.floor(m/60)+' jam '+(m%60)+' menit':(m/60)+' jam');
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const num=n=>String(Math.round(n*100)/100).replace('.',',');
const noWA=p=>{let d=String(p||'').replace(/\D/g,'');if(!d)return null;if(d[0]==='0')d='62'+d.slice(1);else if(d.slice(0,2)!=='62'&&d[0]==='8')d='62'+d;return d.length>=10&&d.length<=15?d:null};
const isi=(t,kv)=>Object.keys(kv).reduce((h,k)=>h.split('{'+k+'}').join(kv[k]==null?'':kv[k]),t||'');
const tumpang=(a,b)=>toMnt(a.jam)<toMnt(b.jam)+b.durasi&&toMnt(b.jam)<toMnt(a.jam)+a.durasi;
// dua jadwal mingguan bentrok? (global: satu slot hanya satu siswa; kalau tidak: bentrok bila guru atau siswa sama)
const bentrok=(a,b,global)=>+a.hari===+b.hari&&tumpang(a,b)&&(!!global||a.siswa_id===b.siswa_id||a.guru_id===b.guru_id);
// rekap satu siswa dalam satu bulan. sesi = semua sesi bulan itu; now = 'YYYY-MM-DDTHH:MM'
function hitung(sesi,s,set,now){
  const r={hadirM:0,alpaM:0,planM:0,hadirU:0,alpaU:0,planU:0,hadir:0,izin:0,sakit:0,alpa:0,belum:0,n:0};
  for(const x of sesi){
    if(x.siswa_id!==s.id||x.status==='diganti'||x.status==='batal')continue;
    const u=x.durasi/(x.durasi_dasar||60);
    r.n++;r.planM+=x.durasi;r.planU+=u;
    if(x.status==='hadir'){r.hadir++;r.hadirM+=x.durasi;r.hadirU+=u}
    else if(x.status==='alpa'){r.alpa++;r.alpaM+=x.durasi;r.alpaU+=u}
    else if(x.status==='izin')r.izin++;
    else if(x.status==='sakit')r.sakit++;
    else if(x.status==='terjadwal'&&x.tanggal+'T'+endT(x.jam,x.durasi)<now)r.belum++;
  }
  const harga=+s.harga||0;
  const unit=s.bayar_jenis==='akhir'?r.hadirU+(set.alpa_ditagih?r.alpaU:0):r.planU;
  const total=s.harga_jenis==='per_bulan'?(r.n>0?harga:0):Math.round(harga*unit);
  return Object.assign(r,{unit,total});
}
// </logic>

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hariIni=()=>ymd(new Date());
const nowStr=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};

const IC={

 guru:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="11" rx="1.5"/><path d="M12 15v5M8 20h8"/></svg>',

const EM=u=>{u=u.trim().toLowerCase();return u.includes('@')?u:u+'@les.app'};
let onLogout=()=>{};
async function sb(p,o,retry){
  o=o||{};if(retry===undefined)retry=1;
  let r;
  try{r=await fetch(SB+p,Object.assign({},o,{headers:Object.assign({apikey:KEY,'Content-Type':'application/json',Authorization:'Bearer '+(ses?ses.access_token:KEY)},o.headers||{})}))}
  catch(e){throw new Error('Tidak ada koneksi internet. Coba lagi.')}
  if(r.status===401&&ses&&retry&&p.startsWith('/rest')){
    let t;try{t=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ses.refresh_token})})}catch(e){throw new Error('Tidak ada koneksi internet. Coba lagi.')}
    if(t.ok){setS(await t.json());return sb(p,o,0)}
    setS(null);onLogout();throw new Error('Sesi habis. Silakan masuk lagi.');
  }
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok)throw new Error(friendly((j&&(j.message||j.error_description||j.msg))||('Kesalahan '+r.status)));
  return j;
}
function friendly(m){
  m=String(m);
  if(/violates foreign key/i.test(m))return 'Data ini masih dipakai data lain (jadwal atau riwayat les). Nonaktifkan saja.';
  if(/Invalid login/i.test(m))return 'Username atau password salah.';
  return m.replace(/^BENTROK: /,'Bentrok: ');
}
const get=(t,q)=>sb('/rest/v1/'+t+(q?'?'+q:''));
const post=(t,rows)=>sb('/rest/v1/'+t,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(rows)});
const patch=(t,f,b)=>sb('/rest/v1/'+t+'?'+f,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(b)});
const hapus=(t,f)=>sb('/rest/v1/'+t+'?'+f,{method:'DELETE'});
const rpc=(fn,a)=>sb('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(a||{})});

function toast(msg,gagal,aksi){
  const el=document.createElement('div');el.className='tos'+(gagal?' gagal':'');
  el.innerHTML='<span>'+esc(msg)+'</span>'+(aksi?'<button type="button">'+esc(aksi.label)+'</button>':'');
  if(aksi)el.querySelector('button').onclick=()=>{el.remove();aksi.fn()};
  const box=$('#toast');box.appendChild(el);
  setTimeout(()=>el.remove(),aksi?8000:(gagal?6000:3200));
}

async function muatMaster(){

    get('jl_siswa','select=*&order=nama.asc'),
    get('jl_guru','select=*&order=nama.asc'),
    get('jl_jadwal','select=*&aktif=eq.true&order=hari.asc,jam.asc'),

async function kirimPesan(no,teks,tipe,siswaId,guruId,nama){
  if(!noWA(no)){toast('Nomor WhatsApp belum diisi atau tidak valid',true);return false}
  if(!S.token)return bukaWA(no,teks);
  if(!confirm('Kirim pesan WhatsApp ke '+(nama||no)+' sekarang?'))return false;
  const r=await rpc('jl_kirim_wa',{p_tujuan:no,p_pesan:teks,p_tipe:tipe,p_siswa:siswaId||null,p_guru:guruId||null});
  if(!r||!r.ok)throw new Error((r&&r.error)||'Gagal mengirim pesan');
  toast('Pesan masuk antrean pengiriman. Status ada di Cek jadwal, tab Notifikasi.');
  return true;
}

    if(tanpa.length)h+='<div class="info">Belum punya jadwal: '+tanpa.map(x=>esc(x.nama)).join(', ')+'.</div>';
  }else{
    for(let d=1;d<=7;d++){
      const l=S.jadwal.filter(j=>j.hari===d).sort((a,b)=>a.jam.localeCompare(b.jam));
      h+='<div class="card"><div class="nama" style="margin-bottom:4px">'+HARI_ISO[d]+'</div>'+(l.length?l.map(j=>'<div class="js2"><div><b>'+hm(j.jam)+'-'+endT(j.jam,j.durasi)+'</b> '+esc(sn(j.siswa_id))+'<div class="sub">'+esc(gn(j.guru_id))+', '+fmtDur(j.durasi)+'</div></div><div class="ra"><button class="btn ghost sm" data-act="jadwalUbah" data-id="'+j.id+'">Ubah</button><button class="btn teks bahaya sm" data-act="jadwalHapus" data-id="'+j.id+'">Hapus</button></div></div>').join(''):'<div class="sub">Kosong</div>')+'</div>';

  }

}

// ===== cek jadwal: agenda, absensi, ganti jadwal, notifikasi =====
const STATUS_LBL={terjadwal:'Terjadwal',hadir:'Hadir',izin:'Izin',sakit:'Sakit',alpa:'Alpa',diganti:'Diganti',batal:'Batal'};
const BISA_GANTI=['terjadwal','izin','sakit','alpa'];
let G={asal:null,bagian:[],catatan:''};
S.cache=[];

async function muatSesi(dari,sampai){
  await rpc('jl_generate_sesi',{p_dari:dari,p_sampai:sampai});
  return get('jl_sesi','select=*&tanggal=gte.'+dari+'&tanggal=lte.'+sampai+'&order=tanggal.asc,jam.asc');
}
async function muatPenggantian(sesi){
  if(!sesi.length)return [];
  const l=sesi.map(x=>x.id).join(',');
  return get('jl_penggantian','select=*,ke:jl_sesi!ke_sesi_id(tanggal,jam,durasi),asal:jl_sesi!asal_sesi_id(tanggal,jam)&or=(asal_sesi_id.in.('+l+'),ke_sesi_id.in.('+l+'))');
}
const kvSesi=x=>({siswa:sn(x.siswa_id),guru:gn(x.guru_id),hari:HARI[parseD(x.tanggal).getDay()],tanggal:fmtTgl(x.tanggal).split(', ')[1],jam:hm(x.jam),durasi:fmtDur(x.durasi),lembaga:lembaga()});

function catatanSesi(x,pg){
  const c=[];
  if(x.jenis==='pengganti'){const p=pg.find(p=>p.ke_sesi_id===x.id&&p.mode==='baru');c.push('Sesi pengganti'+(p&&p.asal?' untuk '+fmtTgl3(p.asal.tanggal):''))}
  pg.filter(p=>p.ke_sesi_id===x.id&&p.mode==='tambah').forEach(p=>c.push('Termasuk tambahan '+p.menit+' menit pengganti '+(p.asal?fmtTgl3(p.asal.tanggal):'sesi lain')));
  if(x.status==='diganti'){
    const to=pg.filter(p=>p.asal_sesi_id===x.id&&p.ke).map(p=>fmtTgl3(p.ke.tanggal)+(p.mode==='tambah'?' (tambah '+p.menit+' mnt)':' '+hm(p.ke.jam)+' ('+p.menit+' mnt)'));
    if(to.length)c.push('Dipindah ke '+to.join(', '));
  }
  if(x.catatan)c.push(x.catatan);
  return c;
}
function kartuSesi(x,pg,absen){
  const s=sById(x.siswa_id),g=gById(x.guru_id),cat=catatanSesi(x,pg);
  let aksi='';
  if(absen){
    if(x.status==='diganti')aksi='<div class="aksi"><button class="btn ghost sm" data-act="batalGanti" data-id="'+x.id+'">Batalkan penggantian</button></div>';
    else if(x.status==='batal')aksi='<div class="aksi"><button class="btn ghost sm" data-act="setStatus" data-id="'+x.id+'" data-s="terjadwal">Pulihkan sesi</button></div>';
    else aksi='<div class="abs" role="group" aria-label="Absensi '+esc(s.nama)+'">'+['hadir','izin','sakit','alpa'].map(k=>'<button type="button" class="s-'+k+'" aria-pressed="'+(x.status===k)+'" data-act="setStatus" data-id="'+x.id+'" data-s="'+k+'">'+STATUS_LBL[k]+'</button>').join('')+'</div>'
      +'<div class="aksi">'+(BISA_GANTI.indexOf(x.status)>=0?'<button class="btn ghost sm" data-act="gantiBuka" data-id="'+x.id+'">Ganti jadwal</button>':'')+(x.status==='terjadwal'?'<button class="btn teks bahaya sm" data-act="setStatus" data-id="'+x.id+'" data-s="batal">Batalkan sesi</button>':'')+'</div>';
  }else{
    aksi='<div class="aksi">'+(noWA(s.wa_siswa)?'<button class="btn ghost sm" data-act="waSesi" data-id="'+x.id+'" data-to="siswa">Kirim ke siswa</button>':'')
      +(noWA(g.wa)?'<button class="btn ghost sm" data-act="waSesi" data-id="'+x.id+'" data-to="guru">Kirim ke guru</button>':'')
      +(BISA_GANTI.indexOf(x.status)>=0?'<button class="btn ghost sm" data-act="gantiBuka" data-id="'+x.id+'">Ganti jadwal</button>':'')+'</div>';
  }
  return '<div class="slot"><div class="t">'+hm(x.jam)+'<small>'+endT(x.jam,x.durasi)+'</small></div>'
   +'<div class="kt '+x.status+'"><div class="atas"><div style="min-width:0"><div class="nama">'+esc(s.nama)+'</div><div class="sub">'+esc(g.nama||'-')+', '+fmtDur(x.durasi)+'</div></div>'
   +'<span class="stamp '+x.status+(S.cap===x.id?' baru':'')+'">'+STATUS_LBL[x.status]+'</span></div>'
   +cat.map(c=>'<div class="cat">'+esc(c)+'</div>').join('')+aksi+'</div></div>';
}

async function pgCek(){
  const tabs=[['hari','Jadwal'],['absen','Absensi'],['ganti','Ganti jadwal'],['notif','Notifikasi']];
  let h='<div class="ph"><h1>Cek jadwal</h1></div><div class="tab" role="tablist">'+tabs.map(t=>'<button type="button" role="tab" aria-selected="'+(S.sub===t[0])+'" data-act="sub" data-s="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(S.sub==='ganti')return h+await tampilGanti();
  if(S.sub==='notif')return h+await tampilNotif();
  return h+await tampilHari(S.sub==='absen');
}
ACT.sub=el=>{S.sub=el.dataset.s;render(true)};

async function tampilHari(absen){
  const senin=mondayOf(S.tgl),mgg=addDays(senin,6),t0=hariIni();
  const sesi=await muatSesi(senin,mgg),pg=await muatPenggantian(sesi);
  S.cache=sesi;
  const hari=sesi.filter(x=>x.tanggal===S.tgl);
  let h='<div class="tgl"><button type="button" class="ic" data-act="geserTgl" data-n="-1" aria-label="Hari sebelumnya">'+IC.kiri+'</button><div class="jud">'+fmtTgl(S.tgl)+'<small>'+(S.tgl===t0?'Hari ini':S.tgl===addDays(t0,1)?'Besok':S.tgl===addDays(t0,-1)?'Kemarin':'&nbsp;')+'</small></div><button type="button" class="ic" data-act="geserTgl" data-n="1" aria-label="Hari berikutnya">'+IC.kanan+'</button></div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:10px"><input type="date" value="'+S.tgl+'" data-change="pilihTgl" aria-label="Pilih tanggal" style="flex:1"><button type="button" class="btn ghost" data-act="keHariIni">Hari ini</button></div>';
  h+='<div class="minggu">'+[0,1,2,3,4,5,6].map(i=>{
    const d=addDays(senin,i),n=sesi.filter(x=>x.tanggal===d&&x.status!=='diganti'&&x.status!=='batal').length;
    return '<button type="button" data-act="pilihHari" data-t="'+d+'" aria-pressed="'+(d===S.tgl)+'" class="'+(d===t0?'hini':'')+'" aria-label="'+fmtTgl(d)+'"><span>'+HARI_ISO[i+1].slice(0,3)+'</span><b>'+parseD(d).getDate()+'</b><i>'+(n||'')+'</i></button>';
  }).join('')+'</div>';
  if(S.tgl===t0){
    const d=new Date(),nm=d.getHours()*60+d.getMinutes(),lim=S.set.pengingat_menit||30;
    const segera=hari.filter(x=>x.status==='terjadwal'&&toMnt(x.jam)-nm<=lim&&toMnt(x.jam)-nm>=-10);
    if(segera.length)h+='<div class="warn">Segera mulai: '+segera.map(x=>esc(sn(x.siswa_id))+' pukul '+hm(x.jam)).join(', ')+'.</div>';
  }
  if(!absen&&!(S.set.wa_otomatis&&S.token))h+='<div class="info">Pengingat WA otomatis belum aktif. Atur di Pengaturan, atau kirim manual dengan tombol di tiap sesi.</div>';
  if(absen&&hari.some(x=>x.status==='terjadwal'))h+='<div style="margin-bottom:12px"><button type="button" class="btn ghost" data-act="semuaHadir">Tandai semua sesi terjadwal hadir</button></div>';
  h+=hari.length?'<div class="agenda">'+hari.map(x=>kartuSesi(x,pg,absen)).join('')+'</div>':'<div class="kosong">Tidak ada les pada hari ini.</div>';
  return h;
}

// ----- ganti jadwal -----
function bukaGanti(id){
  const a=S.cache.find(x=>x.id===id);if(!a)return;
  G={asal:a,bagian:[{tanggal:'',menit:a.durasi,jam:hm(a.jam),mode:'',ada:null,cek:false}],catatan:a.catatan||''};
  bukaPanel('Ganti jadwal',htmlGanti());ringkasGanti();
}
ACT.gantiBuka=el=>bukaGanti(el.dataset.id);
function teksHint(b){
  if(!b.tanggal)return 'Pilih tanggal pengganti.';
  if(b.tanggal===G.asal.tanggal)return 'Tanggal pengganti tidak boleh sama dengan sesi asal.';
  if(b.cek)return 'Memeriksa jadwal pada tanggal itu...';
  if(b.mode==='tambah')return 'Siswa sudah punya les pukul '+hm(b.ada.jam)+'-'+endT(b.ada.jam,b.ada.durasi)+' pada '+fmtTgl3(b.tanggal)+'. Durasinya bertambah '+(+b.menit||0)+' menit, jadi '+fmtDur(b.ada.durasi+(+b.menit||0))+'.';
  if(b.mode==='baru')return 'Belum ada les pada '+fmtTgl3(b.tanggal)+'. Dibuat sesi baru, atur jam mulainya.';
  return '';
}

function ringkasGanti(){
  const a=G.asal,tot=G.bagian.reduce((s,b)=>s+(+b.menit||0),0),box=$('#gsum');if(!box)return;
  box.innerHTML=tot===a.durasi?'<div class="ok">Total '+tot+' dari '+a.durasi+' menit.</div>':'<div class="'+(tot>a.durasi?'err':'warn')+'">Total '+tot+' dari '+a.durasi+' menit. '+(tot>a.durasi?'Lebih ':'Kurang ')+Math.abs(a.durasi-tot)+' menit.</div>';

function segarkanBaris(i){
  const b=G.bagian[i],h=$('#gh'+i),j=$('#gj'+i);

function bagiRata(){
  const n=G.bagian.length,d=G.asal.durasi,base=Math.floor(d/n/5)*5;
  if(base<5)throw new Error('Durasi terlalu pendek untuk dibagi lagi');
  G.bagian.forEach((b,i)=>{b.menit=i<n-1?base:d-base*(n-1)});
}

ACT.gKurang=()=>{if(G.bagian.length>1){G.bagian.pop();bagiRata();ulangBaris()}};
INP.gMenit=el=>{const b=G.bagian[+el.dataset.i];b.menit=+el.value||0;segarkanBaris(+el.dataset.i);ringkasGanti()};
INP.gJam=el=>{G.bagian[+el.dataset.i].jam=el.value};

INP.gTgl=async el=>{
  const i=+el.dataset.i,b=G.bagian[i];b.tanggal=el.value;b.mode='';b.ada=null;
  if(!b.tanggal||b.tanggal===G.asal.tanggal){segarkanBaris(i);return}
  b.cek=true;segarkanBaris(i);
  try{
    await rpc('jl_generate_sesi',{p_dari:b.tanggal,p_sampai:b.tanggal});

    if(G.bagian[i]!==b||b.tanggal!==el.value)return;

};
ACT.gSimpan=async el=>{
  const a=G.asal;
  if(G.bagian.some(b=>!b.tanggal))throw new Error('Isi tanggal untuk setiap bagian');
  if(G.bagian.some(b=>b.tanggal===a.tanggal))throw new Error('Tanggal pengganti tidak boleh sama dengan sesi asal');
  const tot=G.bagian.reduce((s,b)=>s+(+b.menit||0),0);
  if(tot!==a.durasi)throw new Error('Total menit harus '+a.durasi+' (sekarang '+tot+')');
  el.disabled=true;
  try{
    const r=await rpc('jl_ganti_jadwal',{p_asal:a.id,p_bagian:G.bagian.map(b=>({tanggal:b.tanggal,menit:+b.menit,jam:b.jam||hm(a.jam)})),p_catatan:G.catatan.trim()||null});

    const baris=r.bagian.map(p=>{const k=ke.find(z=>z.id===p.sesi_id)||{};return fmtTgl(k.tanggal)+': '+(p.mode==='tambah'?'tambah '+p.menit+' menit, les jadi pukul '+hm(k.jam)+'-'+endT(k.jam,k.durasi):'sesi baru pukul '+hm(k.jam)+'-'+endT(k.jam,k.durasi))});
    hasilGanti(a,baris);
  }finally{el.disabled=false}
};
function hasilGanti(a,baris){

  bukaPanel('Jadwal berhasil diganti','<div class="ok">Penggantian tersimpan.</div><ul style="padding-left:18px;margin:0 0 14px">'+baris.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>'
   +'<div class="nama" style="margin-bottom:8px">Kabari lewat WhatsApp</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'
   +['siswa','ortu','guru'].filter(k=>noWA(G.kepada[k][0])).map(k=>'<button type="button" class="btn ghost" data-act="gWA" data-to="'+k+'">Kirim ke '+(k==='ortu'?'orang tua':k)+'</button>').join('')+'</div>'

// ===== laporan =====
const bulanIni=()=>hariIni().slice(0,7);
const bulanLalu=()=>{const p=bulanIni().split('-').map(Number);return p[1]===1?(p[0]-1)+'-12':p[0]+'-'+pad(p[1]-1)};
const akhirBulan=m=>{const p=m.split('-').map(Number);return ymd(new Date(p[0],p[1],0))};
async function dataBulan(m){
  await rpc('jl_generate_sesi',{p_dari:m+'-01',p_sampai:akhirBulan(m)});
  return get('jl_sesi','select=*&tanggal=gte.'+m+'-01&tanggal=lte.'+akhirBulan(m));
}
const noTagih=s=>noWA(s.wa_ortu)?s.wa_ortu:s.wa_siswa;
function rekap(sesi,jenis){
  const now=nowStr();
  return S.siswa.filter(s=>s.bayar_jenis===jenis).map(s=>({s,r:hitung(sesi,s,S.set,now)})).filter(x=>x.s.aktif||x.r.n>0);
}
function barisLap(x,jenis,m){
  const s=x.s,r=x.r,jamH=r.hadirM,jamT=r.planM;
  const kirim=x.r.total>0&&noWA(noTagih(s))?'<button type="button" class="btn ghost sm" data-act="lapKirim" data-j="'+jenis+'" data-id="'+s.id+'">'+(jenis==='akhir'?'Kirim tagihan':'Ingatkan bayar')+'</button>':'<span class="sub">'+(r.total>0?'Nomor WA kosong':'-')+'</span>';
  return '<tr><td><div class="nama"><button type="button" class="lnk" data-act="lapDetail" data-j="'+jenis+'" data-id="'+s.id+'">'+esc(s.nama)+'</button>'+(s.aktif?'':' <span class="chip">Nonaktif</span>')+'</div><div class="sub">'+rp(s.harga)+(s.harga_jenis==='per_bulan'?' per bulan':' per pertemuan')+'</div>'
   +(r.belum?'<div class="sub" style="color:var(--amber)">'+r.belum+' sesi belum diabsen</div>':'')+'</td>'
   +'<td>'+fmtDur(jamH)+'<div class="sub">'+r.hadir+' hadir'+(r.izin||r.sakit?', '+(r.izin+r.sakit)+' izin atau sakit':'')+(r.alpa?', '+r.alpa+' alpa':'')+'</div></td>'
   +'<td>'+fmtDur(jamT)+'</td><td class="r">'+num(r.unit)+'</td><td class="r"><b>'+rp(r.total)+'</b></td><td>'+kirim+'</td></tr>';
}
function tabelLap(rows,jenis,m){
  if(!rows.length)return '<div class="kosong">Belum ada siswa dengan pembayaran di '+jenis+' bulan.</div>';
  const tj=rows.reduce((a,x)=>a+x.r.hadirM,0),tp=rows.reduce((a,x)=>a+x.r.planM,0),tt=rows.reduce((a,x)=>a+x.r.total,0);
  return '<div class="tw"><table><thead><tr><th>Siswa</th><th>Jam hadir</th><th>Jam terjadwal</th><th class="r">'+(jenis==='akhir'?'Pertemuan ditagih':'Pertemuan bulan ini')+'</th><th class="r">Biaya</th><th></th></tr></thead><tbody>'
   +rows.map(x=>barisLap(x,jenis,m)).join('')+'</tbody><tfoot><tr><td>Total</td><td>'+fmtDur(tj)+'</td><td>'+fmtDur(tp)+'</td><td></td><td class="r">'+rp(tt)+'</td><td></td></tr></tfoot></table></div>';
}
async function pgLap(){
  const mA=S.lapAkhir||bulanLalu(),mW=S.lapAwal||bulanIni();
  const r=await Promise.all([dataBulan(mA),mA===mW?null:dataBulan(mW)]);
  const sA=r[0],sW=r[1]||r[0];
  const A=rekap(sA,'akhir'),W=rekap(sW,'awal');
  S.lapCache={akhir:{m:mA,rows:A,sesi:sA},awal:{m:mW,rows:W,sesi:sW}};
  const gate=S.token;
  let h='<div class="ph"><h1>Laporan</h1></div>';
  h+='<div class="bagian"><h2>Bayar di akhir bulan</h2><input type="month" value="'+mA+'" data-change="lapAkhir" aria-label="Bulan tagihan akhir" style="width:auto"></div>';
  h+='<div class="sub" style="margin-bottom:8px">Tagihan dihitung dari sesi yang hadir'+(S.set.alpa_ditagih?' dan alpa':'')+' pada '+fmtBulan(mA)+'. Biaya per bulan dihitung penuh bila ada sesi.</div>';
  if(mA>=bulanIni())h+='<div class="warn">Bulan ini belum berakhir, jadi angkanya masih sementara.</div>';
  h+=tabelLap(A,'akhir',mA);
  if(gate&&A.some(x=>x.r.total>0&&noWA(noTagih(x.s))))h+='<div style="margin-top:10px"><button type="button" class="btn" data-act="lapSemua" data-j="akhir">Kirim semua tagihan '+fmtBulan(mA)+'</button></div>';
  h+='<div class="bagian" style="margin-top:26px"><h2>Bayar di awal bulan</h2><input type="month" value="'+mW+'" data-change="lapAwal" aria-label="Bulan pengingat bayar awal" style="width:auto"></div>';
  h+='<div class="sub" style="margin-bottom:8px">Jumlah dihitung dari sesi terjadwal pada '+fmtBulan(mW)+'. Kirim pengingat saat bulan berganti.</div>';
  h+=tabelLap(W,'awal',mW);
  if(gate&&W.some(x=>x.r.total>0&&noWA(noTagih(x.s))))h+='<div style="margin-top:10px"><button type="button" class="btn" data-act="lapSemua" data-j="awal">Kirim semua pengingat '+fmtBulan(mW)+'</button></div>';
  if(!gate)h+='<div class="info" style="margin-top:14px">Tombol kirim membuka WhatsApp dengan pesan yang sudah terisi. Isi token Fonnte di Pengaturan agar pesan terkirim langsung dari aplikasi.</div>';
  return h;
}
INP.lapAkhir=el=>{if(el.value){S.lapAkhir=el.value;render(true)}};
INP.lapAwal=el=>{if(el.value){S.lapAwal=el.value;render(true)}};
function pesanTagih(jenis,x,m){
  const r=x.r,min=jenis==='akhir'?r.hadirM+(S.set.alpa_ditagih?r.alpaM:0):r.planM;
  return isi(jenis==='akhir'?S.set.tpl_tagihan_akhir:S.set.tpl_tagihan_awal,{siswa:x.s.nama,lembaga:lembaga(),bulan:fmtBulan(m),jam:num(min/60),pertemuan:num(r.unit),total:rp(r.total)});
}

  const j=el.dataset.j,c=S.lapCache[j],x=c.rows.find(z=>z.s.id===el.dataset.id);if(!x)return;

  else h+='<div class="tw"><table><thead><tr><th>Hari dan tanggal</th><th>Jam</th><th>Status</th><th class="r">Dihitung</th></tr></thead><tbody>'
   +l.map(z=>'<tr><td>'+esc(fmtTgl(z.tanggal))+(z.jenis&&z.jenis!=='reguler'?'<div class="sub">Pengganti</div>':'')+'</td><td>'+hm(z.jam)+'-'+endT(z.jam,z.durasi)+'<div class="sub">'+fmtDur(z.durasi)+'</div></td><td><span class="stamp '+z.status+'">'+STATUS_LBL[z.status]+'</span></td><td class="r">'+(dihitung(z.status)?num(z.durasi/(z.durasi_dasar||60))+' pert.':'-')+'</td></tr>').join('')+'</tbody></table></div>';

ACT.lapKirim=async el=>{

  await kirimPesan(noTagih(x.s),pesanTagih(j,x,c.m),j==='akhir'?'tagihan_akhir':'tagihan_awal',x.s.id,null,(noWA(x.s.wa_ortu)?'orang tua ':'')+x.s.nama);
};
ACT.lapSemua=async el=>{
  const j=el.dataset.j,c=S.lapCache[j],kirim=c.rows.filter(x=>x.r.total>0&&noWA(noTagih(x.s)));
  if(!kirim.length)return;
  if(!confirm('Kirim '+(j==='akhir'?'tagihan':'pengingat bayar')+' '+fmtBulan(c.m)+' ke '+kirim.length+' siswa lewat WhatsApp sekarang?'))return;
  el.disabled=true;let ok=0,gagalN=0;
  for(const x of kirim){
    try{const r=await rpc('jl_kirim_wa',{p_tujuan:noTagih(x.s),p_pesan:pesanTagih(j,x,c.m),p_tipe:j==='akhir'?'tagihan_akhir':'tagihan_awal',p_siswa:x.s.id,p_guru:null});if(r&&r.ok)ok++;else gagalN++}catch(e){gagalN++}
  }
  el.disabled=false;
  toast(ok+' pesan masuk antrean'+(gagalN?', '+gagalN+' gagal. Cek Notifikasi.':'.'),gagalN>0);
};

// ===== pengaturan =====
const cekHtml=(n,v,t)=>'<label class="cek"><input type="checkbox" name="'+n+'"'+(v?' checked':'')+'><span>'+t+'</span></label>';
async function pgSet(){
  const c=S.set,tp=(n,l,hint)=>'<label class="f"><span class="n">'+l+'</span><textarea name="'+n+'" maxlength="600">'+esc(c[n])+'</textarea><small>'+hint+'</small></label>';
  return '<div class="ph"><h1>Pengaturan</h1><div class="sub">Versi '+VERSI+'</div></div>'
   +'<form data-form="setSimpan"><div class="card"><h2 style="margin-bottom:10px">Umum</h2>'
   +'<label class="f"><span class="n">Nama lembaga</span><input type="text" name="nama_lembaga" required maxlength="60" value="'+esc(c.nama_lembaga)+'"></label>'
   +'<label class="f"><span class="n">Aturan bentrok jadwal</span><select name="bentrok_global"><option value="true"'+sel(true,!!c.bentrok_global)+'>Satu slot waktu hanya untuk satu siswa</option><option value="false"'+sel(false,!!c.bentrok_global)+'>Bentrok hanya jika guru atau siswanya sama</option></select><small>Berlaku untuk jadwal baru. Jadwal yang sudah ada tidak diperiksa ulang.</small></label>'
   +cekHtml('alpa_ditagih',c.alpa_ditagih,'Siswa yang alpa tetap ditagih (untuk bayar di akhir bulan)')+'</div>'
   +'<div class="card"><h2 style="margin-bottom:10px">WhatsApp otomatis</h2>'
   +(S.token?'<div class="ok">Token Fonnte sudah tersimpan.</div>':'<div class="warn">Token Fonnte belum diisi. Isi di bagian Token WhatsApp di bawah.</div>')
   +cekHtml('wa_otomatis',c.wa_otomatis,'Kirim pengingat otomatis (les dan reminder)')
   +'<div class="dua"><label class="f"><span class="n">Pengingat les (menit sebelum)</span><input type="number" name="pengingat_menit" min="5" max="240" required value="'+c.pengingat_menit+'"></label>'
   +'<label class="f"><span class="n">Reminder ulangan atau PR (H-)</span><input type="number" name="reminder_hari_sebelum" min="0" max="14" required value="'+c.reminder_hari_sebelum+'"></label></div>'
   +'<label class="f"><span class="n">Jam kirim reminder (WIB)</span><input type="number" name="reminder_jam" min="0" max="23" required value="'+c.reminder_jam+'"></label>'
   +cekHtml('reminder_ke_ortu',c.reminder_ke_ortu,'Kirim reminder ulangan atau PR juga ke orang tua')+'</div>'
   +'<div class="card"><h2 style="margin-bottom:10px">Isi pesan</h2>'
   +tp('tpl_les_siswa','Pengingat les ke siswa','Kode: {siswa} {guru} {hari} {tanggal} {jam} {durasi} {lembaga}')
   +tp('tpl_les_guru','Pengingat les ke guru','Kode: {siswa} {guru} {hari} {tanggal} {jam} {durasi} {lembaga}')
   +tp('tpl_reminder','Reminder ulangan, PR, tugas','Kode: {siswa} {jenis} {hari} {tanggal} {ket} {lembaga}')
   +tp('tpl_tagihan_akhir','Tagihan bayar di akhir','Kode: {siswa} {bulan} {jam} {pertemuan} {total} {lembaga}')
   +tp('tpl_tagihan_awal','Pengingat bayar di awal','Kode: {siswa} {bulan} {jam} {pertemuan} {total} {lembaga}')+'</div>'
   +'<button class="btn blok" type="submit">Simpan pengaturan</button></form>'
   +'<div class="card" style="margin-top:14px"><h2 style="margin-bottom:6px">Token WhatsApp (Fonnte)</h2>'
   +'<p class="sub" style="margin:0 0 10px">Daftar di fonnte.com, hubungkan nomor WhatsApp pengirim, lalu tempel token perangkat di sini. Token disimpan di server dan tidak bisa dibaca kembali dari aplikasi.</p>'
   +'<form data-form="tokenSimpan"><label class="f"><span class="n">Token</span><input type="password" name="token" autocomplete="off" placeholder="'+(S.token?'Token tersimpan. Isi untuk mengganti':'Tempel token di sini')+'"></label>'
   +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Simpan token</button>'+(S.token?'<button type="button" class="btn ghost bahaya" data-act="tokenHapus">Hapus token</button>':'')+'</div></form>'
   +(S.token?'<form data-form="tesKirim" style="margin-top:14px"><label class="f"><span class="n">Kirim pesan tes ke nomor</span><input type="tel" name="no" inputmode="tel" required placeholder="08123456789"></label><button class="btn ghost" type="submit">Kirim pesan tes</button></form>':'')+'</div>'
   +'<div class="card"><h2 style="margin-bottom:6px">Akun</h2><p class="sub" style="margin:0 0 10px">Login memakai akun yang sama dengan sistem les.</p><button type="button" class="btn ghost" data-act="keluar">Keluar</button></div>';
}
FORM.setSimpan=async f=>{
  const E=f.elements,v=n=>E[n].value,c=n=>E[n].checked;
  const b={nama_lembaga:v('nama_lembaga').trim(),bentrok_global:v('bentrok_global')==='true',alpa_ditagih:c('alpa_ditagih'),wa_otomatis:c('wa_otomatis'),
    pengingat_menit:+v('pengingat_menit'),reminder_hari_sebelum:+v('reminder_hari_sebelum'),reminder_jam:+v('reminder_jam'),reminder_ke_ortu:c('reminder_ke_ortu'),
    tpl_les_siswa:v('tpl_les_siswa'),tpl_les_guru:v('tpl_les_guru'),tpl_reminder:v('tpl_reminder'),tpl_tagihan_akhir:v('tpl_tagihan_akhir'),tpl_tagihan_awal:v('tpl_tagihan_awal'),updated_at:new Date().toISOString()};
  if(!b.nama_lembaga)throw new Error('Nama lembaga wajib diisi');
  await patch('jl_pengaturan','id=eq.1',b);
  await muatMaster();toast(b.wa_otomatis&&!S.token?'Tersimpan. WA otomatis belum jalan karena token belum diisi.':'Pengaturan disimpan',b.wa_otomatis&&!S.token);render(true);
};
FORM.tokenSimpan=async f=>{
  const t=f.elements.token.value.trim();if(!t)throw new Error('Tempel token dulu');
  await rpc('jl_set_wa_token',{p_token:t});await muatMaster();toast('Token disimpan');render(true);
};
ACT.tokenHapus=async()=>{
  if(!confirm('Hapus token? Pengiriman WA otomatis akan berhenti.'))return;
  await rpc('jl_set_wa_token',{p_token:''});await muatMaster();toast('Token dihapus');render(true);
};
FORM.tesKirim=async f=>{
  const no=f.elements.no.value;if(!noWA(no))throw new Error('Nomor WhatsApp tidak valid');
  const r=await rpc('jl_kirim_wa',{p_tujuan:no,p_pesan:'Tes pengiriman dari aplikasi Jadwal les ('+lembaga()+'). Jika pesan ini masuk, pengaturan WhatsApp sudah benar.',p_tipe:'tes',p_siswa:null,p_guru:null});
  if(!r||!r.ok)throw new Error((r&&r.error)||'Gagal mengirim');
  toast('Pesan tes diantrekan. Cek hasilnya di Cek jadwal, tab Notifikasi.');
};
ACT.keluar=()=>{if(confirm('Keluar dari aplikasi?')){setS(null);tampilLogin()}};

// ===== kerangka, router, login =====
const PG={siswa:pgSiswa,guru:pgGuru,atur:pgAtur,rem:pgRem,cek:pgCek,lap:pgLap,set:pgSet};
const NAV=[['siswa','Siswa',IC.siswa],['guru','Guru',IC.guru],['atur','Jadwal les',IC.atur],['rem','Reminder',IC.rem],['cek','Cek jadwal',IC.cek],['lap','Laporan',IC.lap]];
function kerangka(){
  $('#root').innerHTML='<div id="app"><header id="top"><b>Jadwal les <small style="font-weight:400;opacity:.8">v'+VERSI+'</small></b><button type="button" class="ic" data-act="goSet" aria-label="Pengaturan">'+IC.gear+'</button></header>'
   +'<nav id="nav" aria-label="Menu utama">'+NAV.map(n=>'<button type="button" data-act="nav" data-p="'+n[0]+'">'+n[2]+'<span>'+n[1]+'</span></button>').join('')+'</nav><main id="main"></main></div>';
}
function tandaiNav(){document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.p===S.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function go(p){S.page=p;tandaiNav();window.scrollTo(0,0);return render(false)}
ACT.nav=el=>go(el.dataset.p);
async function render(diam){
  const my=++S.rid,m=$('#main');if(!m)return;
  if(!diam)m.innerHTML='<div class="muat">Memuat...</div>';
  try{const h=await PG[S.page]();if(my!==S.rid)return;m.innerHTML=h}
  catch(e){if(my!==S.rid)return;m.innerHTML='<div class="err">'+esc(e.message)+'</div><button type="button" class="btn ghost" data-act="segarkan">Coba lagi</button>'}
}
function tampilLogin(pesan){
  tutupPanel();
  $('#root').innerHTML='<div class="login"><h1>Jadwal les</h1><p class="sub" style="margin:4px 0 18px">Masuk dengan akun yang sama seperti sistem les.</p>'+(pesan?'<div class="err">'+esc(pesan)+'</div>':'')
   +'<form data-form="masuk"><label class="f"><span class="n">Username</span><input type="text" name="u" autocomplete="username" autocapitalize="none" required></label>'
   +'<label class="f"><span class="n">Password</span><input type="password" name="p" autocomplete="current-password" required></label><button class="btn blok" type="submit">Masuk</button></form></div>';
}
FORM.masuk=async f=>{
  let r;try{r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:EM(f.elements.u.value),password:f.elements.p.value})})}
  catch(e){throw new Error('Tidak ada koneksi internet. Coba lagi.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(friendly(j.error_description||j.msg||j.message||'Username atau password salah.'));
  setS(j);await mulai();
};
async function mulai(){
  kerangka();$('#main').innerHTML='<div class="muat">Memuat...</div>';
  try{await muatMaster()}
  catch(e){if(!ses){tampilLogin('Sesi habis. Silakan masuk lagi.');return}$('#main').innerHTML='<div class="err">'+esc(e.message)+'</div><button type="button" class="btn ghost" data-act="muatUlang">Coba lagi</button>';return}
  tandaiNav();render(false);
}
ACT.muatUlang=()=>mulai();
onLogout=()=>tampilLogin('Sesi habis. Silakan masuk lagi.');

// muat ulang otomatis saat aplikasi dibuka kembali, dan tiap 90 detik di halaman jadwal
function boleh(){const a=document.activeElement;return $('#sheet').hidden&&!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ses&&S.page==='cek'&&boleh())render(true)});
setInterval(()=>{if(!document.hidden&&ses&&S.page==='cek'&&S.sub!=='ganti'&&boleh())render(true)},90000);

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.Capacitor){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
if(ses)mulai();else tampilLogin();
</script>
</body>
