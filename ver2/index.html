function login(){M.innerHTML=`<div class=md><h3>Masuk</h3><label>Username<input id=lu></label><label>Password<input id=lp type=password></label><button onclick="api('login',{u:lu.value,p:lp.value}).then(init).catch(e=>alert('Gagal masuk: '+e))">Masuk</button></div>`}
function init(){M.innerHTML='';if(!ses)return login();api('db').then(d=>{D={...D,...d};D.classes.forEach(c=>{if(!c.jd&&c.time)c.jd=(c.once||c.dt||'')+' '+c.time});draw()}).catch(e=>{alert('Login berhasil, tetapi gagal memuat data: '+e+'. Pastikan setup.sql sudah dijalankan di Supabase.');login()})}
init();
</script>
